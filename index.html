<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="手順ムービー">
<meta name="theme-color" content="#1f5fbf">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>検査手順ムービー</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1c2230;--sub:#5d6778;--line:#dde1e8;--pri:#1f5fbf;--pri-ink:#fff;--warn:#c0392b;--mark:#e53935;--soft:#eef3fb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151b;--card:#1b2029;--ink:#e8ecf2;--sub:#9aa5b5;--line:#2c3340;--pri:#4d8ff0;--pri-ink:#fff;--soft:#1f2a3d}}
:root[data-theme="dark"]{--bg:#12151b;--card:#1b2029;--ink:#e8ecf2;--sub:#9aa5b5;--line:#2c3340;--pri:#4d8ff0;--pri-ink:#fff;--soft:#1f2a3d}
*{box-sizing:border-box}
html,body{overscroll-behavior-y:none}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP","Segoe UI",sans-serif;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
a{color:var(--pri)}
.top{position:sticky;top:0;z-index:20}
header{background:var(--card);border-bottom:1px solid var(--line);padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));display:flex;align-items:center;gap:6px}
header h1{font-size:17px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer;min-height:44px;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;touch-action:manipulation}
header button{min-height:38px;padding:5px 10px}
button.pri{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
button.danger{color:var(--warn)}
button:disabled{opacity:.45;cursor:default}
button.sm{min-height:38px;padding:5px 10px;font-size:14px}
.role{font-size:14px;font-weight:700}
.role.ed{background:#e7f6ec;color:#16632f;border-color:#9fd3b0}
.role.vw{background:#eef1f6;color:#44506a}
#hNav.on{background:#fff7d6;color:#3b2f00;border-color:#e0a800}
#pbar{display:flex;gap:6px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--line);padding:6px 12px;scrollbar-width:none}
#pbar::-webkit-scrollbar{display:none}
#pbar button{flex:0 0 auto;min-height:34px;padding:3px 14px;font-size:14px;border-radius:18px}
#pbar button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
#nav{background:#fff7d6;color:#3b2f00;border-bottom:1px solid #e8d77a;padding:6px 12px}
#nav .navin{max-width:820px;margin:0 auto;display:flex;gap:8px;align-items:center}
#nav .navno{background:#e0a800;color:#fff;font-weight:700;font-size:12px;border-radius:14px;padding:2px 9px;white-space:nowrap}
#nav .navtx{flex:1;font-size:13.5px;line-height:1.4}
#nav button{min-height:34px;padding:4px 10px;background:#fff;color:#3b2f00;border-color:#d9c35a;white-space:nowrap}
main{max-width:820px;margin:0 auto;padding:12px 12px 150px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
h3{margin:0 0 8px;font-size:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mt{margin-top:8px}
.grow{flex:1;min-width:0}
.sub{color:var(--sub);font-size:14px}
.small{font-size:12px;margin:4px 0}
.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
label.f{display:block;font-size:13px;color:var(--sub);margin:8px 0 2px}
input[type=text],input[type=password],input[type=date],input[type=search],textarea,select{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
textarea{min-height:58px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.vwrap{position:relative;width:fit-content;max-width:100%;margin:6px auto}
.vwrap video,.vwrap img{display:block;max-width:100%;max-height:48vh;border-radius:8px;background:#000}
.cutpage #sPlayer .vwrap video{max-height:32vh}
#tImg img,#tImg video{max-height:30vh}
.thumb{cursor:crosshair}
.marks{position:absolute;inset:0;pointer-events:none}
.mk{position:absolute;width:13%;aspect-ratio:1;border:4px solid var(--mark);border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 2px rgba(255,255,255,.6)}
.noimg{padding:30px;text-align:center;background:#000;color:#aaa;border-radius:8px}
.srow{border-top:1px solid var(--line);padding:6px 0}
.srow:first-child{border-top:0}
.srow-m{display:flex;gap:8px;align-items:center;cursor:pointer}
.srow-m img,.nothumb{width:72px;height:44px;object-fit:cover;border-radius:6px;background:#000;flex:0 0 auto}
.srow .tools{margin:6px 0 2px;gap:6px}
.chev{color:var(--sub);font-size:12px;width:16px;text-align:center}
.strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.strip div{flex:0 0 64px;border:2px solid transparent;border-radius:8px;padding:1px;cursor:pointer;font-size:12px;text-align:center}
.strip div.on{border-color:var(--pri)}
.strip div.empty span{color:var(--warn);font-weight:700}
.strip img{width:100%;height:36px;object-fit:cover;border-radius:6px;background:#000;display:block}
.fin{display:grid;gap:8px}
.fin button{width:100%;text-align:left}
.big{font-size:20px;line-height:1.65;margin:12px 0}
.tl{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.tl div{border:2px solid transparent;border-radius:8px;padding:2px;cursor:pointer;font-size:12px;text-align:center}
.tl div.on{border-color:var(--pri)}
.tl img{width:100%;border-radius:6px;aspect-ratio:16/9;object-fit:cover;background:#000;display:block}
.pg-off{display:none!important}
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
#tabbar button{flex:1;border:0;border-radius:0;background:none;min-height:56px;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--sub);padding:4px 0}
#tabbar button b{font-size:20px;line-height:1.1;font-weight:400}
#tabbar button.on{color:var(--pri);font-weight:700}
#tabbar button[hidden]{display:none}
#pnext{position:fixed;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom));z-index:24;display:flex;gap:8px;padding:6px 12px;background:linear-gradient(rgba(0,0,0,0),var(--bg) 35%)}
#pnext button{flex:1;min-height:42px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:var(--card);color:var(--ink);border-radius:14px;padding:16px;width:100%;max-width:480px;max-height:90vh;overflow:auto}
.mbox video{width:100%;max-height:48vh;border-radius:8px;background:#000;margin-top:8px}
.modal.sheet{align-items:flex-end;padding:0}
.modal.sheet .mbox{border-radius:16px 16px 0 0;max-width:640px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.tlist button{width:100%;text-align:left;margin-top:6px;display:flex;gap:8px;align-items:center}
.tlist .cat{font-size:12px;color:var(--sub);margin:12px 0 0;font-weight:700}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;width:0;background:var(--pri);transition:width .3s}
.linkbtn{display:inline-flex;align-items:center;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--ink);background:var(--soft)}
#tHole{position:fixed;z-index:60;border:3px solid #ffd400;border-radius:12px;box-shadow:0 0 0 9999px rgba(0,0,0,.42);pointer-events:none;transition:left .2s,top .2s,width .2s,height .2s}
#tCard{position:fixed;left:8px;right:8px;z-index:61;background:var(--card);color:var(--ink);border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.35);padding:10px 12px;max-width:560px;margin:0 auto}
#tCard h4{margin:6px 0 2px;font-size:16px}
#tCard p{margin:2px 0 8px;font-size:14px;line-height:1.5}
.tprog{height:5px;background:var(--line);border-radius:3px;overflow:hidden}.tprog i{display:block;height:100%;background:#e0a800}
.tnote{background:#fff3cd;color:#5a4300;border-radius:8px;padding:6px 8px;font-size:13px;margin-bottom:8px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(224,168,0,.9)}100%{box-shadow:0 0 0 14px rgba(224,168,0,0)}}
.pulse{animation:pulse 1s ease-out 3;outline:3px solid #e0a800;outline-offset:2px}
#tip{position:fixed;z-index:70;max-width:300px;background:#20252f;color:#fff;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.5;box-shadow:0 6px 20px rgba(0,0,0,.35)}
#tip b{display:block;margin-bottom:2px}#tip a{color:#9cc3ff;display:inline-block;margin-top:4px}
#hello{position:fixed;left:12px;right:12px;bottom:calc(66px + env(safe-area-inset-bottom));z-index:30;background:#20252f;color:#fff;border-radius:12px;padding:10px 12px;font-size:14px;display:flex;gap:8px;align-items:center;max-width:560px;margin:0 auto}
#hello button{min-height:34px;padding:3px 10px;background:#fff;color:#20252f;border:0}
.toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:20px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:80;max-width:90vw;text-align:center}
.toast.on{opacity:1}
#drop{position:fixed;inset:0;z-index:90;background:rgba(31,95,191,.16);border:4px dashed var(--pri);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:var(--pri);pointer-events:none}
.dprev{max-height:42vh;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px;margin-top:8px}
.dprev div{display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);padding:4px 0;font-size:13px}.dprev div:first-child{border-top:0}
.dprev img,.dprev .ni{width:64px;height:40px;object-fit:cover;border-radius:4px;background:#ccc;flex:0 0 auto}
.opt{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:14px}.opt input{margin-top:4px}
.tlw{overflow-x:auto;overflow-y:hidden;border:1px solid var(--line);border-radius:8px;background:#15181e;-webkit-overflow-scrolling:touch;margin-top:4px}
.tli{position:relative;height:78px;min-width:100%}
.strip2{position:absolute;left:0;top:12px;height:54px;display:flex;pointer-events:none}
.strip2 img{height:54px;object-fit:cover;display:block;flex:0 0 auto;opacity:.6}
.gapz{position:absolute;top:12px;height:54px;background:repeating-linear-gradient(45deg,rgba(0,0,0,.72) 0 6px,rgba(0,0,0,.5) 6px 12px);cursor:pointer}
.sg{position:absolute;top:10px;height:58px;border:2px solid rgba(255,255,255,.9);border-radius:6px;color:#fff;font-weight:700;font-size:13px;cursor:pointer}
.sg span{position:absolute;left:4px;top:1px;text-shadow:0 1px 2px #000,0 0 2px #000;pointer-events:none}
.sg.on{border:3px solid #ffd400;z-index:2}
.hd{position:absolute;top:-4px;bottom:-4px;width:30px;touch-action:none;z-index:3;cursor:ew-resize}
.hd::after{content:'';position:absolute;top:50%;left:50%;width:14px;height:34px;margin:-17px 0 0 -7px;background:#ffd400;border-radius:5px;box-shadow:0 0 0 2px #000}
.hd.l{left:-16px}.hd.r{right:-16px}
.ph{position:absolute;top:0;bottom:0;width:2px;background:#ff3b30;z-index:4;pointer-events:none}
.ph::before{content:'';position:absolute;top:0;left:-6px;border:7px solid transparent;border-top-color:#ff3b30}
.ival{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.vbox{margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--soft)}
.vch{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:12px;padding:1px 8px;margin:2px 4px 2px 0;background:var(--card)}
.vch.on{background:#e7f6ec;color:#16632f;border-color:#9fd3b0}
button.rec{background:#c0392b;color:#fff;border-color:#c0392b}
[hidden]{display:none!important}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="top">
  <header>
    <h1 id="hTitle">検査手順ムービー</h1>
    <button id="hRole" class="role">🔓 編集</button>
    <button id="hNav" aria-label="手順ナビ">🧭</button>
    <button id="hHelp" aria-label="使い方">？</button>
  </header>
  <div id="pbar" hidden></div>
  <div id="nav" hidden></div>
</div>
<main id="main"></main>
<div id="pnext" hidden></div>
<nav id="tabbar">
  <button data-v="list"><b>📚</b>一覧</button>
  <button data-v="edit" id="tbEdit"><b>✏️</b>作る・直す</button>
  <button data-v="view"><b>▶️</b>見る</button>
  <button data-v="set" id="tbSet"><b>⚙️</b>設定</button>
</nav>
<div id="tHole" hidden></div>
<div id="tCard" hidden></div>
<div id="tip" hidden></div>
<div class="toast" id="toast"></div>
<div id="drop" hidden>ここに離すと取り込みます</div>
<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const main=$('#main');
const LANGS={ja:{name:'日本語',tts:'ja-JP'},vi:{name:'Tiếng Việt',tts:'vi-VN'},id:{name:'Bahasa Indonesia',tts:'id-ID'}};
const UI={
  ja:{step:'手順',prev:'◀ 前へ',next:'次へ ▶',speak:'🔊 読み上げ',none:'（説明なし）',list:'手順一覧',done:'✔ 最後の手順です',nav:'動画はこの手順の部分をくり返し再生します。赤丸が見る所。「次へ」で進み、右上で言語を切り替え、🔊で読み上げます。',navNo:'見方'},
  vi:{step:'Bước',prev:'◀ Trước',next:'Tiếp ▶',speak:'🔊 Đọc',none:'(Chưa có giải thích)',list:'Danh sách bước',done:'✔ Bước cuối cùng',nav:'Video lặp lại phần của bước này. Vòng tròn đỏ là chỗ cần xem. Nhấn "Tiếp" để sang bước sau, đổi ngôn ngữ ở góc trên, nhấn 🔊 để nghe đọc.',navNo:'Hướng dẫn'},
  id:{step:'Langkah',prev:'◀ Sebelumnya',next:'Berikutnya ▶',speak:'🔊 Bacakan',none:'(Belum ada penjelasan)',list:'Daftar langkah',done:'✔ Langkah terakhir',nav:'Video mengulang bagian langkah ini. Lingkaran merah = bagian yang harus dilihat. Tekan "Berikutnya" untuk lanjut, ganti bahasa di atas, tekan 🔊 untuk dibacakan.',navNo:'Panduan'}
};
const PAGES=[
  {k:'video',n:'① 撮る',s:['#sCap','#sPlayer']},
  {k:'cut',n:'② 切る',s:['#sPlayer','#sCut','#sList']},
  {k:'text',n:'③ 説明',s:['#sText']},
  {k:'fin',n:'④ 仕上げ・送る',s:['#sInfo','#sFin']}
];
const ALLSEC=['#sCap','#sPlayer','#sCut','#sList','#sText','#sInfo','#sFin'];
const forceView=/[?&]view\b/.test(location.search);
let settings={apiKey:'',model:'claude-sonnet-5',glossary:[],ttsKey:'',ttsVoice:'coral'},lock=null,unlocked=false;
let cur=null,curURL=null,view='list',page='video',tIdx=0,openRow=-1,lastId=null;
let inPt=null,outPt=null,inThumb='',segEnd=null,saveTimer=null,vIdx=0,lang='ja',listCount=0;
let navOn=true,onePage=true;

/* ---------- 保存（IndexedDB：動画と手順書、localStorage：表示の好み） ---------- */
let db;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('kensa-movie',1);
  r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('manuals',{keyPath:'id'});d.createObjectStore('videos');d.createObjectStore('kv')};
  r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}
function tx(store,mode,fn){return new Promise((res,rej)=>{const t=db.transaction(store,mode);const req=fn(t.objectStore(store));
  t.oncomplete=()=>res(req?req.result:undefined);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}
const idb={get:(st,k)=>tx(st,'readonly',s=>s.get(k)),all:st=>tx(st,'readonly',s=>s.getAll()),
  put:(st,v,k)=>tx(st,'readwrite',s=>k===undefined?s.put(v):s.put(v,k)),del:(st,k)=>tx(st,'readwrite',s=>s.delete(k))};
function lsGet(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function ssGet(k){try{return sessionStorage.getItem(k)}catch(e){return null}}
function ssSet(k,v){try{sessionStorage.setItem(k,v)}catch(e){}}

/* ---------- 共通 ---------- */
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmt(t){if(t==null||isNaN(t))return'--';const m=Math.floor(t/60);return m+':'+(t-m*60).toFixed(1).padStart(4,'0')}
function toast(msg,ms=2400){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),ms)}
function marksHTML(ms){return (ms||[]).map(m=>`<div class="mk" style="left:${m.x}%;top:${m.y}%"></div>`).join('')}
function setTitle(t){$('#hTitle').textContent=t}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function save(){if(!cur)return;cur.updatedAt=Date.now();await idb.put('manuals',cur)}
function saveSoon(){clearTimeout(saveTimer);saveTimer=setTimeout(save,400)}
async function loadVideo(vid){if(curURL){URL.revokeObjectURL(curURL);curURL=null}
  if(!vid)return;const b=await idb.get('videos',vid);if(b)curURL=URL.createObjectURL(b)}
function grab(v,w=640){try{if(!v.videoWidth)return'';const sc=Math.min(1,w/v.videoWidth);const c=document.createElement('canvas');
  c.width=Math.round(v.videoWidth*sc);c.height=Math.round(v.videoHeight*sc);c.getContext('2d').drawImage(v,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',0.72)}catch(e){return''}}
function stopTTS(){try{speechSynthesis.cancel()}catch(e){}try{if(player)player.pause()}catch(e){}}
function blobToDataURL(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b)})}
const isPhoto=s=>s.kind==='photo'||s.start==null;
function loadImage(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>rej(new Error('画像を読み込めません'));im.src=src})}
function toJpeg(im,max,q=0.82){const w0=im.naturalWidth||im.width,h0=im.naturalHeight||im.height,sc=Math.min(1,max/Math.max(w0,h0));const c=document.createElement('canvas');
  c.width=Math.round(w0*sc);c.height=Math.round(h0*sc);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q)}
function newPhotoStep(img,thumb,text=''){return{id:uid(),kind:'photo',start:null,end:null,img:img||'',thumb:thumb||'',text:{ja:text,vi:'',id:''},marks:[]}}
function newManual(){return{id:uid(),title:'',partNo:'',version:'1',revDate:today(),author:'',approver:'',videoId:null,steps:[],history:[{ver:'1',date:today(),note:'制定'}],updatedAt:Date.now()}}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},3000)}
async function shareOrDownload(blob,name){
  try{const f=new File([blob],name,{type:blob.type});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}}
  catch(e){if(e&&e.name==='AbortError')return}
  download(blob,name)}
function safeName(s){return s.replace(/[\\/:*?"<>|\s]+/g,'_')}
function onceSeeked(v){return new Promise(r=>{let d=false;const f=()=>{if(!d){d=true;v.removeEventListener('seeked',f);r()}};v.addEventListener('seeked',f);setTimeout(f,2500)})}
async function seekTo(v,t){v.currentTime=Math.max(0,Math.min(t,(isFinite(v.duration)?v.duration:t+1)-0.05));await onceSeeked(v)}
async function withHiddenVideo(fn){
  const v=document.createElement('video');v.muted=true;v.playsInline=true;v.setAttribute('playsinline','');v.preload='auto';
  v.style.cssText='position:fixed;left:-9999px;top:0;width:4px;height:4px';document.body.appendChild(v);v.src=curURL;
  try{await new Promise((res,rej)=>{if(v.readyState>=1)return res();v.onloadedmetadata=res;v.onerror=()=>rej(new Error('動画を読み込めませんでした'))});
    try{await v.play();v.pause()}catch(e){}
    return await fn(v)}finally{v.remove()}}
function drawMarks(ctx,W,H,marks,ox=0,oy=0){(marks||[]).forEach(k=>{const x=ox+k.x/100*W,y=oy+k.y/100*H,r=0.065*W;
  ctx.lineWidth=W*0.014;ctx.strokeStyle='rgba(255,255,255,.75)';ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke();
  ctx.lineWidth=W*0.008;ctx.strokeStyle='#e53935';ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke()})}

function isEditor(){if(!lock&&!forceView)return true;return unlocked}
async function hashPIN(pin,salt){const s=salt+':'+pin;
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){let h=2166136261;for(const c of s){h^=c.codePointAt(0);h=Math.imul(h,16777619)>>>0}return'f'+h.toString(16)}}
function askPIN(title,msg){return new Promise(res=>{const d=document.createElement('div');d.className='modal';
  d.innerHTML=`<div class="mbox"><h3>${esc(title)}</h3><p class="sub small">${esc(msg||'')}</p>
    <input type="password" inputmode="numeric" maxlength="8" id="pinIn" autocomplete="off" style="font-size:24px;letter-spacing:.3em;text-align:center">
    <div class="row mt"><button class="pri grow" id="pinOk">OK</button><button id="pinNo">やめる</button></div></div>`;
  document.body.appendChild(d);const i=d.querySelector('#pinIn');setTimeout(()=>i.focus(),60);
  const done=v=>{d.remove();res(v)};d.querySelector('#pinOk').onclick=()=>done(i.value.trim());d.querySelector('#pinNo').onclick=()=>done(null);
  i.onkeydown=e=>{if(e.key==='Enter')done(i.value.trim())}})}
async function checkPIN(title){if(!lock)return true;const p=await askPIN(title,'編集者PINを入れてください');if(p==null)return false;
  if(await hashPIN(p,lock.salt)!==lock.hash){alert('PINが違います');return false}return true}

function setPage(k){if(view!=='edit')return;page=k;applyPage();renderChrome();

  if(onePage)window.scrollTo(0,0);else{const p=PAGES.find(x=>x.k===k);const el=$(p.s[k==='cut'?1:0]);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}}
function applyPage(){const show=onePage?PAGES.find(p=>p.k===page).s:ALLSEC;

/* ---------- AI（説明の下書き・翻訳） ---------- */
const NETMSG='インターネットにつながっていないようです。電波・Wi-Fiを確認して、もう一度押してください。';
function apiMsg(st,t,svc){
  if(st===401)return`${svc}のAPIキーが正しくありません。「⚙ 設定」でキーを貼り直してください（期限切れ・削除したキーも使えません）。`;
  if(/credit|balance|billing|quota|insufficient/i.test(t))return`${svc}のクレジット（残高）が足りません。管理画面でクレジットを追加してください。`;
  if(st===429)return`${svc}の利用が集中しています。1分ほど待ってからもう一度押してください。`;
  if(st===529||st>=500)return`${svc}のサーバーが混み合っています。少し待ってからもう一度押してください。`;
  return`${svc}でエラーが起きました（${st}）。内容：`+String(t).slice(0,150)}
async function claude(content,max=1500){
  if(!settings.apiKey)throw new Error('NOKEY');
  let r;try{r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{
    'content-type':'application/json','x-api-key':settings.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:settings.model,max_tokens:max,messages:[{role:'user',content}]})})}catch(e){throw new Error(NETMSG)}
  if(!r.ok){const t=await r.text();throw new Error(apiMsg(r.status,t,'Claude（AI）'))}
  const j=await r.json();return(j.content||[]).map(c=>c.text||'').join('')}
function aiErr(err){
  if(err.message==='NOKEY'){if(confirm('AIを使うにはAPIキーの設定が必要です。設定画面を開きますか？\n（キーがなくても、説明は手で書け、訳は「Google翻訳で確認」から貼り付けられます）'))showSettings()}
  else if(err.message!=='CANCEL')alert(err.message)}
async function translate(text){
  const g=settings.glossary.filter(e=>e.ja&&text.includes(e.ja)).slice(0,200);
  const gl=g.map(e=>`${e.ja} → vi: ${e.vi||'-'} / id: ${e.id||'-'}`).join('\n');
  const prompt=`あなたはプラスチック成形工場の品質検査手順書の翻訳者です。次の日本語の作業説明を、ベトナム語とインドネシア語に翻訳してください。
・現場の外国人作業者が一読で分かる、短く平易な文にする
・用語集にある語は、必ず用語集の訳語を使う
・数値・単位・記号・品番は変えない
・出力はJSONのみ：{"vi":"ベトナム語訳","id":"インドネシア語訳"}
${gl?'【用語集】\n'+gl+'\n':''}【原文】
${text}`;
  const out=await claude(prompt,2000);const m=out.match(/\{[\s\S]*\}/);if(!m)throw new Error('翻訳結果を読み取れませんでした');
  return JSON.parse(m[0])}
async function trStep(s){const r=await translate(s.text.ja);s.text.vi=(r.vi||'').trim();s.text.id=(r.id||'').trim();await save()}
async function grabFrames(times,w,marks){return withHiddenVideo(async v=>{const out=[];
  for(let k=0;k<times.length;k++){await seekTo(v,times[k]);if(!v.videoWidth)continue;const sc=Math.min(1,w/v.videoWidth);const c=document.createElement('canvas');
    c.width=Math.round(v.videoWidth*sc);c.height=Math.round(v.videoHeight*sc);const ctx=c.getContext('2d');ctx.drawImage(v,0,0,c.width,c.height);
    if(k===0&&marks&&marks.length)drawMarks(ctx,c.width,c.height,marks);out.push(c.toDataURL('image/jpeg',0.8))}
  return out})}
async function aiDescribe(i){
  if(!settings.apiKey)throw new Error('NOKEY');
  const s=cur.steps[i],hint=s.text.ja.trim();
  let frames=[];
  if(isPhoto(s)){const src=s.img||s.thumb;if(src){const im=await loadImage(src),sc=Math.min(1,1024/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);const x=c.getContext('2d');x.drawImage(im,0,0,c.width,c.height);drawMarks(x,c.width,c.height,s.marks);frames=[c.toDataURL('image/jpeg',0.82)]}}
  else{try{frames=await grabFrames([s.start+0.05,(s.start+s.end)/2,Math.max(s.start+0.05,s.end-0.1)],512,s.marks)}catch(e){}
    if(!frames.length&&s.thumb)frames=[s.thumb]}
  if(!frames.length&&!hint)throw new Error('画像を取り出せませんでした。メモを書いてからもう一度押してください');
  const prev=cur.steps.map((x,k)=>k<i&&x.text.ja.trim()?`手順${k+1}：${x.text.ja.trim()}`:'').filter(Boolean).slice(-3).join('\n');
  const txt=`あなたはプラスチック射出成形工場の品質管理の専門家で、作業手順書を作っています。
手順書「${cur.title||'（名称未設定）'}」${cur.partNo?'（品番 '+cur.partNo+'）':''}の手順${i+1}/${cur.steps.length}の${isPhoto(s)?'写真':'動画から切り出した画像（開始・中間・終了）'}を見て、作業者がこの手順で行うことを日本語で書いてください。
・1〜2文、全体で70字以内。「〜する」「〜を確認する」の言い切り
・見る場所、動作、判定の基準（分かれば）を具体的に${s.marks.length?'\n・1枚目の赤丸は特に見てほしい箇所':''}
・画像から確実に分からないこと（数値・品名など）は書かない
・外国人作業者にも分かる、やさしい言葉で
${hint?`【作成者のメモ（最優先。これを正しく整えること）】\n${hint}\n`:''}${prev?`【前の手順】\n${prev}\n`:''}出力は説明文だけ。`;
  const content=[...frames.map(d=>({type:'image',source:{type:'base64',media_type:'image/jpeg',data:d.split(',')[1]}})),{type:'text',text:txt}];
  return(await claude(content,400)).trim().replace(/^["「]|["」]$/g,'')}

async function autoSplit(){
  if(!curURL)return noVideo();
  const vs0=vsteps();if(vs0.length>1&&!confirm(`今の動画の手順（${vs0.length}件）を消して、画面の変化で区切り直します。よろしいですか？`))return;
  const m=progressModal('✂ 自動で区切っています','画面が大きく変わった所を探しています…');
  try{
    const segs=await withHiddenVideo(async v=>{
      const dur=v.duration;if(!isFinite(dur)||dur<=0)throw new Error('動画の長さが分かりません');
      const step=dur>300?1:0.5,W=64,H=36,c=document.createElement('canvas');c.width=W;c.height=H;const ctx=c.getContext('2d',{willReadFrequently:true});
      let prev=null;const diffs=[];
      for(let t=0;t<dur;t+=step){if(m.cancelled)throw new Error('CANCEL');await seekTo(v,t);ctx.drawImage(v,0,0,W,H);
        const d=ctx.getImageData(0,0,W,H).data,g=new Float32Array(W*H);for(let i=0;i<W*H;i++)g[i]=d[i*4]*.299+d[i*4+1]*.587+d[i*4+2]*.114;
        if(prev){let s=0;for(let i=0;i<g.length;i++)s+=Math.abs(g[i]-prev[i]);diffs.push({t:t-step/2,d:s/g.length})}
        prev=g;m.set(t/dur*0.9)}
      const vals=diffs.map(x=>x.d),n=vals.length||1,mean=vals.reduce((a,b)=>a+b,0)/n,sd=Math.sqrt(vals.reduce((a,b)=>a+(b-mean)**2,0)/n);
      const th=Math.max(8,mean+1.8*sd),cuts=[0];
      for(const x of diffs)if(x.d>th&&x.t-cuts[cuts.length-1]>=2)cuts.push(x.t);
      if(cuts.length>1&&dur-cuts[cuts.length-1]<1.2)cuts.pop();cuts.push(dur);
      const out=[];for(let i=0;i<cuts.length-1;i++){const a=cuts[i],b=cuts[i+1];if(b-a<1.2&&out.length)out[out.length-1][1]=b;else out.push([a,b])}
      for(const s of out){if(m.cancelled)throw new Error('CANCEL');await seekTo(v,Math.min(s[0]+0.3,s[1]));s.push(grab(v))}
      return out});
    m.close();if(!segs.length){alert('区切りの候補が見つかりませんでした。手で区切ってください');return}
    await replaceVideoSteps(segs);toast(`${segs.length}個の手順に区切りました。帯の両端で調整できます`,3600)}
  catch(e){m.close();if(e.message!=='CANCEL')alert('自動区切りに失敗しました：'+e.message)}}

function parseCSV(text){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===','||c==='\t'){row.push(f);f=''}

  if(f||row.length){row.push(f);rows.push(row)}

  catch(e){$('#quota').textContent='確認できませんでした'}
  renderChrome();window.scrollTo(0,0)}

let tour=null;
function toursDone(){try{return JSON.parse(lsGet('kensa-tours','[]'))}catch(e){return[]}}
function openSheet(){
  const ed=isEditor(),done=toursDone(),cats=['準備','本番の流れ','困ったとき','終わった後'];
  const d=document.createElement('div');d.className='modal sheet';d.id='sheet';
  d.innerHTML=`<div class="mbox"><div class="row"><h3 class="grow" style="margin:0">？ 使い方</h3><button class="sm" id="shX">閉じる</button></div>
    <div class="row mt"><a class="linkbtn" href="manual.html" target="_blank">📖 取扱説明書（イラスト付き）</a><a class="linkbtn" href="manual.html#qa" target="_blank">❓ Q&A</a></div>
    <div class="tlist">${cats.map(c=>{const ts=TOURS.filter(t=>t.cat===c&&(ed||t.who==='all'));return ts.length?`<div class="cat">${c}</div>`+ts.map(t=>`<button data-tour="${t.id}"><span class="grow">${done.includes(t.id)?'✅':'▶️'} ${t.name}</span><span class="sub small">${t.time}</span></button>`).join(''):''}).join('')}</div>
    <p class="sub small mt">ガイドは、やることを黄色い枠で光らせて1つずつ案内します。ボタンを<b>長押し</b>すると、そのボタンの説明が出ます。</p></div>`;
  document.body.appendChild(d);
  d.onclick=e=>{if(e.target===d||e.target.id==='shX'){d.remove();return}const b=e.target.closest('[data-tour]');if(b){d.remove();startTour(b.dataset.tour)}}}
$('#hHelp').onclick=openSheet;
async function startTour(id){const T=TOURS.find(t=>t.id===id);if(!T)return;if(tour)tourEnd();tour={T,i:0};await tourShow()}
async function ensureScreen(st){
  const id=cur?.id||lastId,m=id?await idb.get('manuals',id):null;
  if(st.scr==='settings'&&view!=='settings'){if(!isEditor())return'編集モードで開けます';await showSettings()}
  else if(st.scr==='list'&&view!=='list'){if(document.querySelector('#capModal'))return null;await showList()}
  else if(st.scr==='edit'||(st.scr==='editOrView'&&isEditor()&&view!=='view')){
    if(!isEditor())return'編集モードにすると出ます';
    if(view!=='edit'){if(m)await showEdit(m.id,st.pg);else return st.need||'手順書を開くと出ます'}
    if(st.pg&&page!==st.pg)setPage(st.pg)}
  else if(st.scr==='view'||st.scr==='editOrView'){if(view!=='view'){if(m)await showView(m.id);else return st.need||'一覧の「見る」で開くと出ます'}}
  return null}
function tourEl(st){for(const s of st.s.split(',')){const el=$(s);if(el&&el.offsetParent!==null&&!el.closest('.pg-off'))return el}return null}
async function tourShow(){
  if(!tour)return;tourClear();const{T,i}=tour,st=T.steps[i],n=T.steps.length,last=i===n-1;
  const note=await ensureScreen(st);if(!tour)return;
  await sleep(80);let el=tourEl(st);
  const hole=$('#tHole'),card=$('#tCard');
  card.hidden=false;
  card.innerHTML=`<div class="tprog"><i style="width:${(i+1)/n*100}%"></i></div>
    <div class="row mt"><b class="grow sub">${esc(T.name)}　${i+1}/${n}</b><button class="sm" id="tcFold">たたむ</button><button class="sm" id="tcX">✕ 終わる</button></div>
    <div id="tcBody"><h4>${esc(st.t)}</h4><p>${esc(st.x)}</p>${el?'':`<div class="tnote">いまは画面に出ていません（${esc(note||st.need||'前の操作をすると出ます')}）</div>`}
    <div class="row"><button class="sm" id="tcPrev" ${i===0?'disabled':''}>◀ 戻る</button>${el?'<button class="sm" id="tcTry">👉 やってみる</button>':''}<button class="pri sm grow" id="tcNext">${last?'完了 ✓':'次へ ▶'}</button></div></div>`;
  $('#tcX').onclick=tourEnd;$('#tcNext').onclick=()=>last?tourFinish():tourGo(1);$('#tcPrev').onclick=()=>tourGo(-1);
  $('#tcFold').onclick=()=>{const b=$('#tcBody');b.hidden=!b.hidden;$('#tcFold').textContent=b.hidden?'ひらく':'たたむ'};
  if($('#tcTry'))$('#tcTry').onclick=()=>{const e=tourEl(st);if(e)pulse(e)};
  if(!el){hole.hidden=true;card.style.top='auto';card.style.bottom='calc(64px + env(safe-area-inset-bottom))';
    tour.poll=setInterval(()=>{if(tourEl(st)){clearInterval(tour.poll);tourShow()}},700);return}
  el.scrollIntoView({block:'center',behavior:'smooth'});hole.hidden=false;
  const loop=()=>{if(!tour)return;if(!el.isConnected){el=tourEl(st);if(!el){tourShow();return}}
    const r=el.getBoundingClientRect(),p=6;
    Object.assign(hole.style,{left:r.left-p+'px',top:r.top-p+'px',width:r.width+p*2+'px',height:r.height+p*2+'px'});
    if(r.top+r.height/2>innerHeight*0.5){card.style.top='calc(env(safe-area-inset-top) + 64px)';card.style.bottom='auto'}
    else{card.style.top='auto';card.style.bottom='calc(64px + env(safe-area-inset-bottom))'}
    tour.raf=requestAnimationFrame(loop)};loop();
  if(!last&&st.a){
    const next=()=>{clearTimeout(tour.timer);tour.timer=setTimeout(()=>tourGo(1),900)};
    if(st.a==='tap'){const h=()=>next();document.addEventListener('click',e=>{if(e.target.closest(st.s))h()},{capture:true,once:false,signal:(tour.ac=new AbortController()).signal})}
    else if(st.a==='pick'){el.addEventListener('change',next,{signal:(tour.ac=new AbortController()).signal})}
    else if(st.a==='idle'){const idle=()=>{clearTimeout(tour.timer);tour.timer=setTimeout(()=>tourGo(1),4000)};el.addEventListener('input',idle,{signal:(tour.ac=new AbortController()).signal})}}}
function tourClear(){if(!tour)return;clearTimeout(tour.timer);clearInterval(tour.poll);cancelAnimationFrame(tour.raf);if(tour.ac)tour.ac.abort();tour.ac=null}
function tourGo(d){if(!tour)return;const j=tour.i+d;if(j<0||j>=tour.T.steps.length)return;tour.i=j;tourShow()}
function tourFinish(){const id=tour.T.id,dn=toursDone();if(!dn.includes(id)){dn.push(id);lsSet('kensa-tours',JSON.stringify(dn))}tourEnd();toast('ガイド完了 ✓')}
function tourEnd(){tourClear();$('#tHole').hidden=true;$('#tCard').hidden=true;tour=null}

let lp=null,lpFired=false;
function findHelp(t){if(!t||!t.closest)return null;for(const h of HELP){const el=t.closest(h.s);if(el)return{h,el}}return null}
document.addEventListener('pointerdown',e=>{lpFired=false;const tip=$('#tip');if(!tip.hidden&&!e.target.closest('#tip'))tip.hidden=true;
  const hit=findHelp(e.target);if(!hit)return;clearTimeout(lp&&lp.t);
  lp={x0:e.clientX,y0:e.clientY,t:setTimeout(()=>{lpFired=true;lp=null;showTip(hit.h,hit.el)},550)}},{passive:true});
document.addEventListener('pointermove',e=>{if(lp&&Math.hypot(e.clientX-lp.x0,e.clientY-lp.y0)>10){clearTimeout(lp.t);lp=null}},{passive:true});
['pointerup','pointercancel'].forEach(ev=>document.addEventListener(ev,()=>{if(lp){clearTimeout(lp.t);lp=null}},{passive:true}));
document.addEventListener('click',e=>{if(lpFired){lpFired=false;e.preventDefault();e.stopPropagation()}},true);
document.addEventListener('contextmenu',e=>{if(findHelp(e.target))e.preventDefault()});
function showTip(h,el){const tip=$('#tip');
  tip.innerHTML=`<b>${esc(h.t)}</b><div>${esc(h.x)}</div>${h.a?`<a href="manual.html#${h.a}" target="_blank">取扱説明書で詳しく →</a>`:''}`;
  tip.hidden=false;const r=el.getBoundingClientRect(),tw=Math.min(300,innerWidth-24);tip.style.width=tw+'px';
  const left=Math.max(12,Math.min(innerWidth-tw-12,r.left+r.width/2-tw/2));tip.style.left=left+'px';
  const th=tip.offsetHeight;tip.style.top=(r.bottom+8+th<innerHeight-60?r.bottom+8:Math.max(8,r.top-8-th))+'px';
  clearTimeout(tip._h);tip._h=setTimeout(()=>tip.hidden=true,7000)}

/* ---------- 起動 ---------- */
window.addEventListener('pagehide',()=>{if(view==='edit')save()});
(async()=>{
  navOn=lsGet('kensa-nav','1')==='1';onePage=lsGet('kensa-onepage','1')==='1';lastId=lsGet('kensa-last','')||null;
  try{await openDB()}catch(e){main.innerHTML='<div class="card">この端末（またはプライベートブラウズ）では保存機能が使えません。</div>';return}
  const s=await idb.get('kv','settings');if(s)settings={...settings,...s};
  lock=(await idb.get('kv','lock'))||null;unlocked=ssGet('kensa-unlocked')==='1';
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  await showList();
  if(!lsGet('kensa-hello','')){lsSet('kensa-hello','1');const h=document.createElement('div');h.id='hello';
    h.innerHTML='<span class="grow">はじめての方は右上の「？」→ ガイドへ。ボタンを<b>長押し</b>すると説明が出ます。</span><button>OK</button>';
    document.body.appendChild(h);h.querySelector('button').onclick=()=>h.remove();setTimeout(()=>h.remove(),15000)}
})();
